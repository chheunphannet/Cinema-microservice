<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
  </defs>
  <!-- Background for contrast -->
  <rect width="100%" height="100%" fill="#ffffff" rx="16" />
  
  <!-- "net" Wordmark -->
  <g fill="#232F3E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-3">
    <text x="75" y="112">net</text>
  </g>
  
  <!-- AWS-inspired curved swoosh / smile arrow linking 'n' to 't' -->
  <g>
    <!-- Curved smile path -->
    <path d="M 85 130 C 145 168, 235 168, 290 134" fill="none" stroke="url(#smileGrad)" stroke-width="8.5" stroke-linecap="round"/>
    
    <!-- Arrowhead pointing up-right at the end of the arc -->
    <polygon points="305,124 282,126 295,142" fill="url(#smileGrad)" stroke="url(#smileGrad)" stroke-width="1" stroke-linejoin="round" />
  </g>
</svg>