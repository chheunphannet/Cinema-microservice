name: cinema-pos-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - cinema_net_prod
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - cinema_net_prod
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - cinema_net_prod
    volumes:
      - rabbitmq-data-prod:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - cinema_net_prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    networks:
      - cinema_net_prod
    volumes:
      - seq-data-prod:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  catalog-api:
    image: cinema-pos-catalog-api:latest
    networks:
      - cinema_net_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &service-env-prod
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8443
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/cert.pfx
      ConnectionStrings__WriteDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__ReadDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__Configuration: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__Port: 5672
      Seq__ServerUrl: http://seq:80
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cinema}
      Gateway__PublicUrl: ${GATEWAY_PUBLIC_URL}
      Tickets__HmacSecret: ${TICKETS_HMAC_SECRET}
      Webhooks__PaymentSecret: ${WEBHOOKS_PAYMENT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-cinemapos}
      Jwt__Audience: ${JWT_AUDIENCE:-cinemapos-clients}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM}
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM}
      Email__Provider: ${EMAIL_PROVIDER:-Resend}
      Email__SenderEmail: ${EMAIL_SENDER_EMAIL}
      Email__SenderName: ${EMAIL_SENDER_NAME}
      Email__Resend__ApiKey: ${RESEND_API_KEY}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  reservation-api:
    image: cinema-pos-reservation-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *service-env-prod
    networks:
      - cinema_net_prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  pos-api:
    image: cinema-pos-pos-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *service-env-prod
    networks:
      - cinema_net_prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  ticket-api:
    image: cinema-pos-ticket-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *service-env-prod
    networks:
      - cinema_net_prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  identity-api:
    image: cinema-pos-identity-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment: *service-env-prod
    networks:
      - cinema_net_prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  loyalty-api:
    image: cinema-pos-loyalty-api:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-env-prod
      OTEL_SERVICE_NAME: loyalty-api
    networks:
      - cinema_net_prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  db-migrator:
    image: cinema-pos-db-migrator:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    networks:
      - cinema_net_prod

  api-gateway:
    image: cinema-pos-api-gateway:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8443
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/cert.pfx
      Services__CatalogUrl: http://catalog-api:8080
      Services__ReservationUrl: http://reservation-api:8080
      Services__PosUrl: http://pos-api:8080
      Services__TicketUrl: http://ticket-api:8080
      Services__IdentityUrl: http://identity-api:8080
      Redis__Configuration: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Seq__ServerUrl: http://seq:80
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "443:8443"
      - "80:8080"
    networks:
      - cinema_net_prod
    volumes:
      - ./infra/certs:/https:ro
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres-data-prod:
  redis-data-prod:
  rabbitmq-data-prod:
  seq-data-prod:

networks:
  cinema_net_prod:
    driver: bridge






